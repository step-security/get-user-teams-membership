# Runs unit and integration tests on push and pull request to default branch.
# Run both on the same job, they are so fast no need to parallelize it
name: tests
permissions:
  contents: read

on:
  pull_request:
    branches:
      [main]
  push:
    branches:
      [main]

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: install, test and build
        run: |
          npm ci
          npm test -- --run
          npm run build